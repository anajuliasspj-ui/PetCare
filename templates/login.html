<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare- Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;600&display=swap">
    <link rel="stylesheet" href ="static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="icon" href="{{ url_for('static', filename='janela_icone.png') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body id="login-body">

    <!-- Ícone da patinha (desenhado uma vez e reaproveitado na trilha) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="pata" viewBox="0 0 32 32">
            <ellipse cx="16" cy="21.5" rx="8" ry="6.3"/>
            <ellipse cx="6.5" cy="13.5" rx="3" ry="3.8" transform="rotate(-18 6.5 13.5)"/>
            <ellipse cx="12.6" cy="7.6" rx="3.1" ry="4"/>
            <ellipse cx="19.4" cy="7.6" rx="3.1" ry="4"/>
            <ellipse cx="25.5" cy="13.5" rx="3" ry="3.8" transform="rotate(18 25.5 13.5)"/>
        </symbol>
    </svg>

    <div id="login-page">
        <div id="login-img">
            <img src="static/cachorro.png" alt="login-img">
        </div>
        <div id="login-form">
            <div id="titulo-login">
                <h2>PetCare</h2>
                <h1>Clínica veterinária</h1>
            </div>

            <div id="login-card">
                <div id="fiep-img">
                    <img src="static/logonew-removebg-preview.png" alt="logo-img">
                </div>
                <form action="/login" method="POST">
                <div class="mb-3">
                    <label>Email</label>
                    <input type="text" class="form-control" id="usuario" name="email" placeholder="seunome@empresa.com" required>
                </div>
                <div class="mb-3">
                    <label>Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>
                <div id="erro-login">
                    <a>Email ou senha incorreto(s).<br> Tente novamente!</a>
                </div>

                <!-- Trilha de patinhas + cachorrinho (o cachorrinho é o botão de enviar) -->
                <div id="trilha-botao">
                    <div id="trilha" aria-hidden="true">
                        <svg class="pata" style="--i:0"><use href="#pata"/></svg>
                        <svg class="pata" style="--i:1"><use href="#pata"/></svg>
                        <svg class="pata" style="--i:2"><use href="#pata"/></svg>
                        <svg class="pata" style="--i:3"><use href="#pata"/></svg>
                    </div>
                    <button id="btn-entrar" type="submit" class="btn-dog" aria-label="Entrar">
                        <img src="static/salsicha.png" alt="">
                    </button>
                </div>
                <p id="dica-patinhas">Siga as patinhas e toque no cachorrinho para entrar</p>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Ao enviar, as patinhas aceleram e o cachorrinho pula enquanto a página carrega
        document.querySelector("#login-card form").addEventListener("submit", function () {
            document.getElementById("login-card").classList.add("enviando");
        });
    </script>
</body>
</html>
